name: Verify the browser extension
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make bootstrap
      - run: pip install -r ml/requirements.txt && python -m unittest discover -s ml -p "test_*.py" -v
      - run: make verify
      - run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: label-ai-browser-extensions
          path: artifacts/packages/*.zip
          if-no-files-found: error
      - run: pnpm --dir packages/provenance exec vite build --config tests/browser/vite.config.mjs --outDir ../../../../artifacts/safari-verifier --base ./
      - uses: actions/upload-artifact@v4
        with:
          name: safari-verifier-harness
          path: artifacts/safari-verifier
  browser:
    needs: extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, chrome-for-testing, brave, edge, opera]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: label-ai-browser-extensions
          path: artifacts/packages
      - run: unzip -q artifacts/packages/label-ai-chromium.zip -d artifacts/chromium
      - run: pip install -r tests/e2e/requirements.txt
      - if: matrix.browser == 'chromium'
        run: python -m playwright install --with-deps chromium
      - if: matrix.browser != 'chromium'
        run: python -m playwright install-deps chromium
      - run: python tools/prepare_provenance_fixtures.py
      - name: Install desktop schemas needed by Opera
        if: matrix.browser == 'opera'
        run: sudo apt-get install -y gsettings-desktop-schemas
      - name: Install and exercise the packaged extension
        env:
          BRAND: ${{ matrix.browser }}
        run: |
          if [ "$BRAND" != chromium ]; then
            LABEL_TEST_BROWSER="$(python tests/e2e/prepare_browser.py "$BRAND" "$RUNNER_TEMP/test-browser")"
            export LABEL_TEST_BROWSER
          fi
          timeout --signal=TERM --kill-after=5s 120s python -u tests/e2e/browser_test.py --build artifacts/chromium --install-only
          timeout --signal=TERM --kill-after=5s 180s python -u tests/e2e/browser_test.py --build artifacts/chromium --pregrant-test-origin --report artifacts/browser-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: browser-verification-${{ matrix.browser }}
          path: artifacts/browser-report.json
  safari-runtime:
    needs: extension
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [desktop, ios-simulator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: label-ai-browser-extensions
          path: artifacts/packages
      - uses: actions/download-artifact@v4
        with:
          name: safari-verifier-harness
          path: artifacts/safari-verifier
      - name: Extract the packaged Safari target
        run: unzip -q artifacts/packages/label-ai-safari.zip -d artifacts/safari-web
      - name: Boot an available iPhone simulator
        if: matrix.platform == 'ios-simulator'
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime, group in reversed(list(devices.items())) if ".iOS-" in runtime for d in group if d["name"].startswith("iPhone") and d["isAvailable"]))')
          xcrun simctl bootstatus "$device" -b
          open -a Simulator --args -CurrentDeviceUDID "$device"
          xcrun simctl launch "$device" com.apple.mobilesafari
          printf 'LABEL_AI_SIMULATOR_UDID=%s\n' "$device" >> "$GITHUB_ENV"
      - name: Install and exercise the packaged extension with SafariDriver
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python3 tools/prepare_provenance_fixtures.py
          sudo /usr/bin/safaridriver --enable
          args=(artifacts/safari-verifier --extension artifacts/safari-web)
          if [ "$PLATFORM" = ios-simulator ]; then args+=(--ios-simulator --simulator-udid "$LABEL_AI_SIMULATOR_UDID"); fi
          python3 -u tests/e2e/safari_verifier.py "${args[@]}"
      - name: Compile the unsigned macOS and iOS host apps
        if: "!cancelled() && matrix.platform == 'desktop'"
        run: |
          tools/package_safari.sh artifacts/safari-web artifacts/xcode
          python3 tools/build_apple_host.py artifacts/xcode
      - uses: actions/upload-artifact@v4
        if: "!cancelled() && matrix.platform == 'desktop' && hashFiles('artifacts/xcode/**/*.pbxproj') != ''"
        with:
          name: label-ai-safari-xcode
          path: |
            artifacts/xcode/**
            !artifacts/xcode/build/**
          if-no-files-found: error

name: Verify the browser extension
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make bootstrap
      - run: pip install -r ml/requirements.txt && python -m unittest discover -s ml -p "test_*.py" -v
      - run: make verify
      - run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: label-ai-browser-extensions
          path: artifacts/packages/*.zip
          if-no-files-found: error
      - run: pnpm --dir apps/extension exec vite build --config ../../packages/provenance/tests/browser/vite.config.mjs --outDir ../../../../artifacts/safari-verifier --base ./
      - uses: actions/upload-artifact@v4
        with:
          name: safari-verifier-harness
          path: artifacts/safari-verifier
  browser:
    needs: extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, chrome-for-testing, brave, edge, opera, vivaldi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: label-ai-browser-extensions
          path: artifacts/packages
      - run: unzip -q artifacts/packages/label-ai-chromium.zip -d artifacts/chromium
      - run: pip install -r tests/e2e/requirements.txt && python -m playwright install --with-deps chromium
      - run: python tools/prepare_provenance_fixtures.py
      - name: Install desktop schemas needed by Opera
        if: matrix.browser == 'opera'
        run: sudo apt-get install -y gsettings-desktop-schemas
      - name: Install and exercise the packaged extension
        env:
          BRAND: ${{ matrix.browser }}
        run: |
          if [ "$BRAND" != chromium ]; then
            LABEL_TEST_BROWSER="$(python tests/e2e/prepare_browser.py "$BRAND" "$RUNNER_TEMP/test-browser")"
            export LABEL_TEST_BROWSER
          fi
          runner=(python -u tests/e2e/browser_test.py)
          if [ "$BRAND" = vivaldi ]; then
            runner=(xvfb-run -a python -u tests/e2e/browser_test.py --desktop-cdp)
          fi
          timeout --signal=TERM --kill-after=5s 120s "${runner[@]}" --build artifacts/chromium --install-only
          timeout --signal=TERM --kill-after=5s 180s "${runner[@]}" --build artifacts/chromium --pregrant-test-origin --report artifacts/browser-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: browser-verification-${{ matrix.browser }}
          path: artifacts/browser-report.json
  safari-wrapper:
    needs: extension
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: label-ai-browser-extensions
          path: artifacts/packages
      - name: Package the unsigned Apple host apps
        run: |
          mkdir -p artifacts/safari-web
          unzip -q artifacts/packages/label-ai-safari.zip -d artifacts/safari-web
          tools/package_safari.sh artifacts/safari-web artifacts/xcode
          python tools/build_apple_host.py artifacts/xcode
      - uses: actions/upload-artifact@v4
        with:
          name: label-ai-safari-xcode
          path: |
            artifacts/xcode/**
            !artifacts/xcode/build/**
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          name: safari-verifier-harness
          path: artifacts/safari-verifier
      - name: Run the real credential verifier in native Safari
        run: |
          python3 tools/prepare_provenance_fixtures.py
          sudo /usr/bin/safaridriver --enable
          python3 tests/e2e/safari_verifier.py artifacts/safari-verifier

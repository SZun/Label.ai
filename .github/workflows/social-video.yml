name: Social video playback
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make bootstrap && pnpm run build:chrome
      - run: python tools/zip_extension.py apps/extension/.output/chrome-mv3 artifacts/chromium.zip
      - uses: actions/upload-artifact@v4
        with:
          name: social-video-extension
          path: artifacts/chromium.zip

  playback:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        target: [stream, canvas, video-check, public-clip]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-social-browser
      - name: Check the installed extension on playing video
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          if [[ "$TARGET" == video-check ]]; then
            python -u tests/e2e/generated_video.py --video-check --browser "$(cat "$RUNNER_TEMP/browser-path")" --build artifacts/chromium
            exit
          fi
          if [[ "$TARGET" == public-clip ]]; then
            python -u tests/e2e/generated_video.py --direct --browser "$(cat "$RUNNER_TEMP/browser-path")" --build artifacts/chromium
            exit
          fi
          args=()
          if [[ "$TARGET" == stream || "$TARGET" == canvas ]]; then
            if [[ "$TARGET" == canvas ]]; then args+=(--canvas-player); fi
            command -v ffmpeg || sudo apt-get install -y ffmpeg
          fi
          python -u tests/e2e/social_video.py --browser "$(cat "$RUNNER_TEMP/browser-path")" --build artifacts/chromium "${args[@]}"

  social:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        platform: [youtube, tiktok, facebook, instagram, x]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-social-browser
      - name: Play the public post and verify the production badge on its player
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python -u tests/e2e/social_video.py --live "$PLATFORM" --browser "$(cat "$RUNNER_TEMP/browser-path")" --build artifacts/chromium

  five-platform-acceptance:
    needs: social
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all five live players to pass
        env:
          RESULT: ${{ needs.social.result }}
        run: test "$RESULT" = success
